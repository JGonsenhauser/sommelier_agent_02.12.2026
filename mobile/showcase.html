<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Jarvis to your phone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 32px 16px;
        }
        .card {
            max-width: 520px;
            width: 100%;
        }
        img.logo { width: 96px; height: 96px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 650; margin-bottom: 8px; }
        p { color: #cfcfcf; line-height: 1.5; margin-bottom: 20px; }
        .qr {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            display: inline-block;
        }
        .qr img { width: min(72vw, 360px); height: auto; display: block; }
        .url {
            margin-top: 16px;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 14px;
            color: #f5d76e;
            word-break: break-all;
        }
        ol {
            text-align: left;
            margin: 24px auto 0;
            max-width: 360px;
            color: #ddd;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/icon-192.png" alt="Jarvis">
        <h1>Jarvis</h1>
        <p>Scan to open the sommelier, then add it to your Home Screen.</p>
        <div class="qr"><img src="/qr.png" alt="QR code for Jarvis"></div>
        <div class="url" id="url"></div>
        <ol>
            <li>Scan this code with your phone camera</li>
            <li>Open the page in Safari (iPhone) or Chrome (Android)</li>
            <li>iPhone: Share → Add to Home Screen</li>
            <li>Android: menu → Install app / Add to Home screen</li>
        </ol>
    </div>
    <script>
        document.getElementById("url").textContent = window.location.origin + "/";
    </script>
</body>
</html>
