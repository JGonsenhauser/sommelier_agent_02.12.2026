<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F3EEE6">
    <title>Jarvis Sommelier</title>
    <link rel="icon" type="image/png" href="/brand-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Outfit, sans-serif;
            background: #F3EEE6;
            color: #1C1A16;
            text-align: center;
            padding: 32px 16px;
        }
        .card { max-width: 520px; width: 100%; }
        img.logo { height: 72px; width: 72px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; background: #111; }
        h1 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        p { color: #6B645C; line-height: 1.5; margin-bottom: 24px; font-weight: 300; }
        .qr {
            background: #FAF7F2;
            border-radius: 8px;
            padding: 24px;
            display: inline-block;
        }
        .qr img { width: min(64vw, 320px); height: auto; display: block; }
        .credit {
            margin-top: 28px;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #7A8A78;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" id="logo" src="/brand-logo.png" alt="Jarvis">
        <h1>Jarvis</h1>
        <p>Scan to see two bottles from tonight’s list.</p>
        <div class="qr"><img src="/qr.png" alt="QR code"></div>
        <div class="credit" id="credit">Jarvis Sommelier</div>
    </div>
    <script>
        const r = new URLSearchParams(location.search).get("r") || "demo";
        fetch("/api/restaurants/" + r)
            .then((res) => res.ok ? res.json() : null)
            .then((data) => {
                if (!data) return;
                if (data.logo) {
                    const img = document.getElementById("logo");
                    img.src = data.logo;
                    img.alt = data.name || "Jarvis";
                }
                document.getElementById("credit").textContent = (data.name || "Jarvis") + " Sommelier";
            })
            .catch(() => {});
    </script>
</body>
</html>
